# ==============================================================================
#  Village in the Shade - Mod Engine Settings (v1.30)
#
#  * ตำแหน่งไฟล์: วางไว้ที่โฟลเดอร์เกม (ข้าง village.exe)
#    C:\Program Files (x86)\Steam\steamapps\common\Village in the Shade\settings.ini
#
#  * สวิตช์ป้องกันม็อดพังเมื่อเกมอัปเดต (Update-Proof Controls):
#    หากเกมมีอัปเดตแพตช์ใหม่ สามารถเปลี่ยนค่าเป็น 0 เพื่อปิดระบบที่ต้องการได้ทันที
# ==============================================================================

[Settings]
# ==============================================================================
# สวิตช์หลักเปิด/ปิด ม็อดภาษาไทยทั้งหมด (Master Switch)
# 1 = [ปกติ] เปิดใช้งานม็อดแปลภาษาไทย (ข้อความไทย, ภาพไทย, ฟอนต์ไทย, แป้นพิมพ์ไทย)
# 0 = ปิดม็อดภาษาไทยทั้งหมด 100% (เกมเป็นภาษาอังกฤษ/ญี่ปุ่นดั้งเดิม แต่สูตรโกงและ Speedhack ยังใช้งานได้เต็มระบบ!)
#     * สำหรับคนที่อยากเล่นเกมภาษาอังกฤษเดิมๆ แต่อยากใช้สูตรโกง / Speedhack *
# ==============================================================================
enable_thai_mod = 1

# ระบบฟอนต์ตัวชิดอัตโนมัติ (Proportional Font)
# 1 = เปิดระบบจัดช่องไฟฟอนต์ชิดกันแบบสัดส่วนจริง (Proportional Mode) สระและพยัญชนะไม่ห่าง
# 0 = ปิด (ใช้ฟอนต์ตารางเดิมของเกม)
enable_proportional_font = 1

# แป้นพิมพ์ภาษาไทย 182 ปุ่มในเกม (Thai Virtual Keyboard)
# 1 = [ปกติ] เปิดใช้งานแป้นพิมพ์ภาษาไทย (พิมพ์ชื่อตัวละคร/สัตว์เลี้ยงเป็นภาษาไทยได้)
# 0 = ปิด (ใช้แป้นพิมพ์ดั้งเดิมของเกม)
enable_thai_keyboard = 1

# โหมดการแสดงผลรูปภาพ UI / เมนู / ใบปลิว (Texture System Mode)
# 1 = [แนะนำ] ภาพที่แปลแล้วแสดงเป็น "ไทย" + ภาพที่เหลือดึง "อังกฤษ" มาแสดงแทน (ไม่มีหลุดเป็นญี่ปุ่น)
# 2 = บังคับใช้ภาพ "ภาษาอังกฤษ" ทั้งหมด 100%
# 0 = ปิดม็อดภาพ ใช้ภาพดั้งเดิมของเกม 100% (ไว้กันเกมอัปเดตใหม่แล้วอยากเล่นแบบเดิม)
texture_mode = 1

# ระบบภาพแผนที่ภาษาไทย (Thai Minimap)
# 1 = [ปกติ] เปิดใช้งานแผนที่แปลภาษาไทย
# 2 = ปิดเฉพาะแผนที่ภาษาไทย (กลับไปใช้แผนที่ภาษาอังกฤษ en)
# 0 = ปิดเฉพาะแผนที่ภาษาไทย (กลับไปใช้แผนที่ดั้งเดิมของเกม 100% โดยที่ภาพ UI อื่นๆ ยังเป็นภาษาไทยครบถ้วน)
#     * สำหรับผู้เล่นที่เจอปัญหาเปิดแผนที่แล้วเป็นจอสีเทาว่างเปล่า หรือเครื่องสเปกต่ำที่โหลดแผนที่ 4K ไม่ขึ้น *
enable_thai_minimap = 1

# ระบบแทนที่ไฟล์ฐานข้อมูลแปลไทย (.dat Database Override)
# ------------------------------------------------------------------------------
# dat_en: สำหรับผู้เล่นที่ตั้งค่าภาษาในเกมเป็น "English" (ดึงดาต้าเบสแปลจาก EN)
# dat_ja: สำหรับผู้เล่นที่ตั้งค่าภาษาในเกมเป็น "Japanese" (ดึงดาต้าเบสแปลจาก JP)
# 
# * กลไกความปลอดภัยอัจฉริยะ (Smart Failsafe):
#   1. หากเปิดทั้งสองอันพร้อมกัน (dat_en = 1 และ dat_ja = 1)
#      -> ระบบจะ "บังคับใช้ dat_en (EN) เสมอ" เพื่อป้องกันฐานข้อมูลขัดแย้งกัน
#   2. หากปิดทั้งสองอัน (dat_en = 0 และ dat_ja = 0) [ค่าเริ่มต้นแนะนำ]
#      -> ปิดการแทนที่ไฟล์ .dat ดั้งเดิมทั้งหมด 100% (Game Update Proof!)
#         ตัวเกมจะดึงคำแปลผ่านระบบ Memory Hooking จาก translation.txt แบบสดๆ ในแรม
#         ข้อดีสูงสุด: "เมื่อเกมอัปเดตแพตช์ใหม่ ตัวเกมจะไม่แครชหรือค้างอย่างแน่นอน"
# ------------------------------------------------------------------------------
dat_en = 0
dat_ja = 0

# ระบบปรับความเร็วเกม (Speedhack Hook: F4 เร่งความเร็ว / F5 ช้าลง / F6 ปกติ)
# 1 = เปิดใช้งานระบบฮุคความเร็วเกม, 0 = ปิด (ใช้เวลาดั้งเดิมของ Windows ไม่ฮุคใดๆ)
# สวิตช์กันเกมอัปเดต: หากเกมอัปเดตแพตช์ใหม่ สามารถปิดเป็น 0 ได้ทันที
enable_speedhack = 1
