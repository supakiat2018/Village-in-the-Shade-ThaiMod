# ==============================================================================
#  Village in the Shade - Mod Engine Settings (v1.30)
#
#  * ตำแหน่งไฟล์: วางไว้ที่โฟลเดอร์เกม (ข้าง village.exe)
#    C:\Program Files (x86)\Steam\steamapps\common\Village in the Shade\settings.ini
#
#  * สวิตช์ป้องกันม็อดพังเมื่อเกมอัปเดต (Update-Proof Controls):
#    หากเกมมีอัปเดตแพตช์ใหม่ สามารถเปลี่ยนค่าเป็น 0 เพื่อปิดระบบที่ต้องการได้ทันที
# ==============================================================================

[Settings]
# ระบบฟอนต์ตัวชิดอัตโนมัติ (Proportional Font)
# 1 = เปิดระบบจัดช่องไฟฟอนต์ชิดกันแบบสัดส่วนจริง (Proportional Mode) สระและพยัญชนะไม่ห่าง
# 0 = ปิด (ใช้ฟอนต์ตารางเดิมของเกม)
enable_proportional_font = 1

# แป้นพิมพ์ภาษาไทย 182 ปุ่มในเกม (Thai Virtual Keyboard)
# 1 = เปิดใช้งานแป้นพิมพ์ภาษาไทย (พิมพ์ชื่อตัวละคร/สัตว์เลี้ยงเป็นภาษาไทยได้)
# 0 = ปิด (ใช้แป้นพิมพ์ดั้งเดิมของเกม)
enable_thai_keyboard = 1

# ระบบแทนที่ภาพ UI และแผนที่ภาษาไทย (Custom Textures)
# 1 = เปิดใช้งานระบบแทนที่ภาพภาษาไทย (VFS Textures / Minimap)
# 0 = ปิด (ใช้ภาพดั้งเดิมของเกม)
enable_custom_textures = 1

# สลับใช้ภาพเมนู/แผนที่ภาษาอังกฤษ (English Textures)
# 0 = ใช้ภาพ UI และแผนที่ภาษาไทยตามปกติ
# 1 = สลับไปใช้ภาพ UI/มินิแมปภาษาอังกฤษ (แม้เล่นโหมดญี่ปุ่น)
use_english_textures = 0
