# ==============================================================================
#  Village in the Shade - Cheats & Hotkeys Configuration (v1.30)
#
#  * ตำแหน่งไฟล์: วางไฟล์นี้ไว้ที่โฟลเดอร์หลักของเกม (ข้าง village.exe) ที่เดียวเท่านั้น!
#    C:\Program Files (x86)\Steam\steamapps\common\Village in the Shade\cheats.ini
#
#  * วิธีเปิด/ปิดสูตร:
#    - 1 = เปิดใช้งานสูตร (Enabled)
#    - 0 = ปิดใช้งานสูตร (Disabled)
#    - สามารถเปลี่ยนชื่อไฟล์เป็น _cheats.ini หรือลบไฟล์ทิ้ง เพื่อปิดสูตรทั้งหมดได้ทันที
# ==============================================================================

[Cheats]
# อมตะ เลือดไม่ลด ไม่โดนดาเมจจากมอนสเตอร์/สิ่งกีดขวาง
god_mode = 1

# ไอเทมไม่ลด (ใช้ของ, โยนของ, ปลูกผัก จำนวนไอเทมจะไม่ลดลง)
infinite_items = 0

# พลังกาย (Stamina) เต็มหลอดตลอดเวลา (อิงโครงสร้าง v1.30 ปลอดภัย 100% ไม่เด้งตอนเกี่ยวข้าว)
infinite_stamina = 0



# เงินไม่จำกัด (ล็อคเงิน 999,999)
infinite_money = 0

# สร้างของ/คราฟต์ของ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_crafting = 0

# ทำอาหาร ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_cooking = 0

# ตีเหล็กและอัปเกรดเครื่องมือ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_smithing = 0

# ก่อสร้างบ้านและโรงเลี้ยงสัตว์ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_building = 0

# ย้อมสีเสื้อผ้าและเฟอร์นิเจอร์ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_dyeing = 0

# ส่งของเควสต์/บันเดิล ได้ทุกไอเทม (สามารถนำไอเทมอะไรก็ได้ไปส่ง)
submit_any_item = 0

# เดินทะลุกำแพง / สิ่งกีดขวาง (Noclip) (1 = เปิดตลอด, 0 = ปิด)
# แนะนำให้ตั้งเป็น 0 แล้วใช้ปุ่มลัด F3 กดเปิด/ปิดเฉพาะเวลาที่ต้องการ
noclip = 0

# หยุดเวลาในเกม (เวลาไม่เดิน)แนะนำให้ตั้งเป็น 0 แล้วใช้ปุ่มลัด (สามารถกดปุ่มลัด F2 เพื่อเปิด/ปิดได้ทันทีขณะเล่น)
freeze_time = 0


# ==============================================================================
#  [Hotkeys] การตั้งค่าปุ่มลัดในเกม (กดได้ทันทีขณะเล่นเกม)
#  * สามารถเปลี่ยนปุ่มได้อิสระ เช่น F1-F12, NUMPAD0-NUMPAD9, NUM-, NUM+, TAB, Q, E ฯลฯ
# ==============================================================================
[Hotkeys]
# เปิดใช้งานระบบปุ่มลัดในเกม (1 = เปิด, 0 = ปิด)
enable_hotkeys = 1

# ปุ่มลัดหยุดเวลา (กดสลับ หยุดเวลา / เวลาเดินปกติ) [อิงสูตร Cheat Table v1.30 Offset 0x3270]
# กดครั้งแรก = หยุดเวลาทันที (มีเสียงปี๊บเตือน) / กดอีกครั้ง = เวลาเดินต่อ
hotkey_freeze_time = F2

# ปุ่มลัดเดินทะลุกำแพง (กดสลับ เปิด / ปิด เดินทะลุสิ่งกีดขวาง)
# กดครั้งแรก = เปิดเดินทะลุ / กดอีกครั้ง = คืนค่าเดินชนตามปกติ
hotkey_noclip = F3

# ปุ่มลัดปรับความเร็วเกม (Speedhack Engine) [อิงสูตร Cheat Table v1.30 ID 500]
# F4 = เร่งความเร็วเกม / F5 = สโลว์โมชัน (ช้าลง) / F6 = คืนความเร็วปกติ (1x)
hotkey_speed_fast = F4
hotkey_speed_slow = F5
hotkey_speed_normal = F6

# ตัวคูณความเร็วเมื่อกด F4 และ F5 (สามารถปรับตัวเลขได้ตามใจชอบ เช่น 2.0, 3.0, 5.0)
speed_multiplier_fast = 2.0
speed_multiplier_slow = 0.5
