# ==============================================================================
#  Village in the Shade - Cheats & Hotkeys Configuration (ระบบสูตรโกง & ปุ่มลัดในเกม)
#
#  * วิธีเปิด/ปิดสูตรทั้งหมดแบบทันที:
#    - เปิดใช้งาน: ตั้งชื่อไฟล์นี้ว่า "cheats.ini"
#    - ปิดใช้งานทันที: แค่เปลี่ยนชื่อไฟล์นี้เป็น "_cheats.ini" หรือลบออก (เกมจะคืนค่าเดิมทันที)
#
#  * การตั้งค่าแต่ละสูตรใน [Cheats]:
#    1 = เปิดใช้งาน (Enabled)
#    0 = ปิดใช้งาน (Disabled)
# ==============================================================================

[Cheats]
# อมตะ เลือดไม่ลด ไม่โดนดาเมจจากมอนสเตอร์/สิ่งกีดขวาง
god_mode = 1

# ไอเทมไม่ลด (ใช้ของ, โยนของ, ปลูกผัก จำนวนไอเทมจะไม่ลด)
infinite_items = 1

# สร้างของ/คราฟต์ของ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_crafting = 1

# ทำอาหาร ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_cooking = 1

# ตีเหล็ก ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_smithing = 1

# ก่อสร้างบ้าน/สิ่งปลูกสร้าง ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_building = 1

# ย้อมสี ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_dyeing = 1

# ส่งของบันเดิล/เควสต์ ได้ทุกไอเทม (สามารถส่งไอเทมอะไรก็ได้)
submit_any_item = 1

# เดินทะลุกำแพง / สิ่งกีดขวาง (Noclip) (1 = เปิดตลอด, 0 = ปิด)
# แนะนำให้ตั้งเป็น 0 แล้วใช้ปุ่มลัด F3 กดเปิด/ปิดเฉพาะเวลาที่ต้องการ
noclip = 0

# พลังกาย (Stamina) เต็มหลอดตลอดเวลา
infinite_stamina = 1

# หยุดเวลาในเกม (เวลาไม่เดิน) (1 = หยุดเวลา, 0 = เวลาเดินตามปกติ)
freeze_time = 0

# เงินไม่จำกัด (ล็อคเงินขั้นต่ำ 999,999) (1 = เปิด, 0 = ปิด)
infinite_money = 0

# ==============================================================================
#  [Hotkeys] การตั้งค่าปุ่มลัดในเกม (กดได้ทันทีขณะเล่นเกม)
#  * สามารถเปลี่ยนปุ่มได้อิสระ เช่น F1-F12, NUMPAD0-NUMPAD9, NUM-, NUM+, TAB, Q, E ฯลฯ
# ==============================================================================
[Hotkeys]
# เปิดใช้งานระบบปุ่มลัดในเกม (1 = เปิด, 0 = ปิด)
enable_hotkeys = 1

# ปุ่มเดินทะลุกำแพง (กดสลับ เปิด/ปิด)
# กดครั้งแรก = เปิดเดินทะลุ / กดอีกครั้ง = คืนค่าเดินปกติ
hotkey_noclip = F3
