# ==============================================================================
#  Village in the Shade - Mod Settings & Cheats Configuration (v1.30)
#
#  * ตำแหน่งไฟล์: วางไฟล์นี้ไว้ที่โฟลเดอร์หลักของเกม (ข้าง village.exe)
#    C:\Program Files (x86)\Steam\steamapps\common\Village in the Shade\cheats.ini
#
#  * วิธีเปิด/ปิดระบบ:
#    - 1 = เปิดใช้งาน (Enabled)
#    - 0 = ปิดใช้งาน (Disabled)
# ==============================================================================

# ==============================================================================
#  [Settings] การตั้งค่าระบบม็อดและการทำงานใน RAM (สวิตช์ป้องกันม็อดพังเมื่อเกมอัปเดต)
# ==============================================================================
[Settings]
# ระบบฟอนต์ตัวชิดอัตโนมัติ (Proportional Font) (1 = เปิดตัวชิดสวยงาม, 0 = ปิด ใช้ฟอนต์เดิมของเกม)
# กันเกมอัปเดต: หากเกมอัปเดตแพตช์ใหม่แล้วมีปัญหา สามารถปิดเป็น 0 ได้ทันที
enable_proportional_font = 1

# แป้นพิมพ์ภาษาไทย 182 ปุ่มในเกม (Thai Virtual Keyboard) (1 = เปิด, 0 = ปิด ใช้แป้นพิมพ์เดิม)
# กันเกมอัปเดต: หากเกมอัปเดตแพตช์ใหม่แล้วตารางปุ่มเลื่อน สามารถปิดเป็น 0 ได้ทันที
enable_thai_keyboard = 1

# ระบบแทนที่ภาพ UI และแผนที่ภาษาไทย (Custom Textures) (1 = เปิดภาพม็อด, 0 = ปิด ใช้ภาพดั้งเดิมของเกม)
enable_custom_textures = 1

# สลับใช้ภาพภาษาอังกฤษ (English Textures) (1 = ใช้ภาพภาษาอังกฤษ, 0 = ใช้ภาพไทยตามปกติ)
# ตัวอย่าง: หากเปิดเป็น 1 แผนที่จะเปลี่ยนเป็นแผนที่ภาษาอังกฤษทันที
use_english_textures = 0


# ==============================================================================
#  [Cheats] ระบบสูตรโกงในเกม (1 = เปิดใช้งาน, 0 = ปิดใช้งาน)
# ==============================================================================
[Cheats]
# อมตะ เลือดไม่ลด ไม่โดนดาเมจจากมอนสเตอร์/สิ่งกีดขวาง
god_mode = 0

# ไอเทมไม่ลด (ใช้ของ, โยนของ, ปลูกผัก จำนวนไอเทมจะไม่ลดลง)
infinite_items = 0

# พลังกาย (Stamina) เต็มหลอดตลอดเวลา (อิงโครงสร้าง v1.30 ปลอดภัย 100% ไม่เด้งตอนเกี่ยวข้าว)
infinite_stamina = 0

# หยุดเวลาในเกม (เวลาไม่เดิน) (สามารถกดปุ่มลัด F2 เพื่อเปิด/ปิดได้ทันทีขณะเล่น)
freeze_time = 0

# เงินไม่จำกัด (ล็อคเงิน 999,999)
infinite_money = 0

# สร้างของ/คราฟต์ของ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_crafting = 0

# ทำอาหาร ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_cooking = 0

# ตีเหล็กและอัปเกรดเครื่องมือ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_smithing = 0

# ก่อสร้างบ้านและโรงเลี้ยงสัตว์ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_building = 0

# ย้อมสีเสื้อผ้าและเฟอร์นิเจอร์ ฟรี (ไม่ต้องใช้วัตถุดิบ)
no_materials_dyeing = 0

# ส่งของเควสต์/บันเดิล ได้ทุกไอเทม (สามารถนำไอเทมอะไรก็ได้ไปส่ง)
submit_any_item = 0

# เดินทะลุกำแพง / สิ่งกีดขวาง (Noclip) (1 = เปิดตลอด, 0 = ปิด)
# แนะนำให้ตั้งเป็น 0 แล้วใช้ปุ่มลัด F3 กดเปิด/ปิดเฉพาะเวลาที่ต้องการ
noclip = 0


# ==============================================================================
#  [Hotkeys] การตั้งค่าปุ่มลัดในเกม (กดได้ทันทีขณะเล่นเกม)
#  * สามารถเปลี่ยนปุ่มได้อิสระ เช่น F1-F12, NUMPAD0-NUMPAD9, NUM-, NUM+, TAB, Q, E ฯลฯ
# ==============================================================================
[Hotkeys]
# เปิดใช้งานระบบปุ่มลัดในเกม (1 = เปิด, 0 = ปิด)
enable_hotkeys = 1

# ปุ่มลัดหยุดเวลา (กดสลับ หยุดเวลา / เวลาเดินปกติ) [อิงสูตร Cheat Table]
# กดครั้งแรก = หยุดเวลาทันที (มีเสียงปี๊บเตือน) / กดอีกครั้ง = เวลาเดินต่อ
hotkey_freeze_time = F2

# ปุ่มลัดเดินทะลุกำแพง (กดสลับ เปิด / ปิด เดินทะลุสิ่งกีดขวาง)
# กดครั้งแรก = เปิดเดินทะลุ / กดอีกครั้ง = คืนค่าเดินชนตามปกติ
hotkey_noclip = F3
